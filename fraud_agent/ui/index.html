<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fraud Investigator — Analyst Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e;
          --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; --vbc:#bc8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif; display:flex; height:100vh; overflow:hidden; }
  aside { width:290px; min-width:290px; background:var(--panel); border-right:1px solid var(--line);
          overflow-y:auto; }
  aside h1 { font-size:15px; margin:0; padding:14px 16px 6px; letter-spacing:.4px; }
  aside .sub { padding:0 16px 10px; color:var(--mut); font-size:11.5px; border-bottom:1px solid var(--line); }
  .case { padding:9px 16px; cursor:pointer; border-bottom:1px solid #21262d; display:flex;
          justify-content:space-between; gap:8px; align-items:center; }
  .case:hover { background:#1c2129; } .case.on { background:#22304a; border-left:3px solid var(--blue); }
  .case b { font-size:12.5px; } .case small { color:var(--mut); display:block; font-size:11px; }
  main { flex:1; overflow-y:auto; padding:18px 24px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }
  .chip { padding:2px 10px; border-radius:20px; font-size:12px; border:1px solid var(--line); }
  .c-red { color:#fff; background:#8b1e1e; border-color:var(--red); }
  .c-amb { color:#fff; background:#7a5a12; border-color:var(--amber); }
  .c-grn { color:#fff; background:#1a5c2a; border-color:var(--green); }
  .c-blu { color:#fff; background:#1c4a7a; border-color:var(--blue); }
  .c-vbc { color:#fff; background:#4c2a7a; border-color:var(--vbc); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .panel h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--blue); }
  .wide { grid-column:1 / -1; }
  .meter { height:10px; background:#21262d; border-radius:6px; overflow:hidden; margin:6px 0; }
  .meter i { display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--amber),var(--red)); }
  .ev { border-left:3px solid var(--blue); padding:6px 10px; margin:8px 0; background:#0d1117; border-radius:0 6px 6px 0; }
  .ev .src { font-size:11px; color:var(--mut); }
  .ev .ref { font-family:ui-monospace,monospace; font-size:11.5px; color:var(--vbc); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:5px 7px; border-bottom:1px solid #21262d; vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:11.5px; }
  .route { font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); }
  .r-auto { color:var(--green); } .r-L1 { color:var(--amber); } .r-L2 { color:var(--red); }
  .timeline { list-style:none; margin:8px 0 0; padding:0; }
  .timeline li { position:relative; padding:0 0 12px 22px; border-left:2px solid var(--line); margin-left:8px; }
  .timeline li::before { content:""; position:absolute; left:-7px; top:3px; width:12px; height:12px;
        border-radius:50%; background:var(--blue); border:2px solid var(--bg); }
  .timeline li.ok::before { background:var(--green); } .timeline li.warn::before { background:var(--amber); }
  .timeline b { font-size:12.5px; } .timeline .t { color:var(--mut); font-size:11.5px; }
  .nar { white-space:pre-wrap; font-size:12.5px; background:#0d1117; padding:10px; border-radius:6px;
         border:1px solid var(--line); max-height:200px; overflow-y:auto; }
  svg text { font:11px ui-monospace,monospace; }
  .gnode { fill:#21262d; stroke:var(--blue); } .gnode.case { stroke:var(--vbc); }
  .gline { stroke:var(--mut); stroke-width:1.5; marker-end:url(#arw); }
  .muted { color:var(--mut); } .mono { font-family:ui-monospace,monospace; font-size:12px; }
  #err { color:var(--red); font-size:12px; }
</style>
</head>
<body>
<aside>
  <h1>FRAUD INVESTIGATOR</h1>
  <div class="sub">20 benchmark cases &middot; TigerGraph Savanna &middot; deterministic decisions, tokens:0</div>
  <div id="list">loading…</div>
</aside>
<main id="detail"></main>
<script>
const IDS = Array.from({length:20}, (_,i)=>`HHG-${String(i+1).padStart(3,"0")}`);
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VC = {fraud:"c-red", uncertain:"c-amb", legitimate:"c-grn"};
const SC = {escalated:"c-amb", closed_fraud:"c-red", closed_legit:"c-grn", closed_legitimate:"c-grn", open:"c-blu"};
let CASES = {}, active = null;

async function boot(){
  const res = await Promise.all(IDS.map(id=>fetch(`/cases/${id}.json`).then(r=>r.ok?r.json():null)));
  res.filter(Boolean).forEach(a=>CASES[a.case_id]=a);
  $("#list").innerHTML = IDS.filter(id=>CASES[id]).map(id=>{
    const c = CASES[id].case;
    return `<div class="case" id="li-${id}" onclick="show('${id}')">
      <span><b>${id}</b><small>${esc(c.pattern)} &middot; ${esc(CASES[id].next_best_actions.final.length)} actions</small></span>
      <span class="chip ${VC[c.verdict]||""}" style="font-size:10.5px">${c.verdict}</span></div>`;
  }).join("");
  show(new URLSearchParams(location.search).get("case") || "HHG-004");
}

function actions(rows, cls=""){
  if(!rows.length) return "<span class='muted'>none</span>";
  return "<table><tr><th>Action</th><th>Approval route</th><th>Why (policy rule)</th></tr>" +
    rows.map(a=>`<tr><td><b>${esc(a.action)}</b></td>
      <td><span class="route r-${a.route}">${a.route}</span></td>
      <td>${esc(a.reason)}</td></tr>`).join("") + "</table>";
}

function timeline(a){
  const c = a.case, nba = a.next_best_actions, trig = (a.case.summary.match(/trigger (\w+)/)||[])[1] || "signal";
  const li = [];
  li.push(`<li class="ok"><b>Trigger</b> <span class="t">${esc(trig)}</span><div class="t">risk/analyst/customer event opened the investigation</div></li>`);
  li.push(`<li class="ok"><b>Investigate</b> <span class="t">${a.tool_calls} graph tool calls, ${a.latency_s}s</span><div class="t">window, device profile, detectors, prior-case memory (${c.similar_prior_cases.length} retrieved)</div></li>`);
  li.push(`<li class="ok"><b>Evidence gathered</b> <span class="t">${c.evidence.length} claims</span><div class="t">${esc(c.evidence.map(e=>e.ref).join(" · "))}</div></li>`);
  if(a.evidence_requests.length)
    li.push(`<li class="warn"><b>More evidence requested</b> <span class="t">after step ${a.evidence_requests[0].asked_after_step}</span><div class="t">${esc(a.evidence_requests[0].type)}: ${esc(a.evidence_requests[0].assumed_response)}</div></li>`);
  li.push(`<li class="ok"><b>Decision</b> <span class="t">p=${c.fraud_probability} → ${esc(c.verdict)} / ${esc(c.status)}</span><div class="t">${esc(a.stop_reason)}</div></li>`);
  if(a.sar.file) li.push(`<li class="warn"><b>SAR filed</b> <span class="t">$${a.sar.total_amount_usd}</span><div class="t">${a.sar.subjects.length} subjects, route L2</div></li>`);
  li.push(`<li class="${c.written_to_graph?"ok":"warn"}"><b>Case written to graph</b>
    <span class="t">${c.written_to_graph ? "vertex "+esc(c.graph_case_id) : "not written"}</span>
    <div class="t">FraudCase vertex + CASE_ON edge — memory for future investigations</div></li>`);
  return `<ul class="timeline">${li.join("")}</ul>`;
}

function graphPanel(id){
  return `<div class="panel wide"><h2>Graph view (live from Savanna)</h2>
    <div id="gbox" class="muted">loading graph edges…</div></div>`;
}

function renderGraph(p){
  const box = $("#gbox"); if(!box) return;
  if(p.error){ box.innerHTML = `<span id="err">graph unavailable: ${esc(p.error)}</span>`; return; }
  const on = (p.case_on||[])[0];
  const dev = (p.device_edges||[])[0];
  const bil = (p.bill_edges||[])[0];
  const W = 760, rows = [];
  let y = 30;
  function edge(fromLbl, etype, toLbl, cls){
    rows.push(`<line class="gline" x1="215" y1="${y}" x2="365" y2="${y}"/>
      <text x="280" y="${y-7}" fill="#8b949e" text-anchor="middle">${etype}</text>
      <rect class="gnode ${cls}" x="8" y="${y-17}" width="205" height="34" rx="7"/>
      <text x="110" y="${y+4}" fill="#e6edf3" text-anchor="middle">${esc(fromLbl)}</text>
      <rect class="gnode" x="367" y="${y-17}" width="380" height="34" rx="7"/>
      <text x="557" y="${y+4}" fill="#e6edf3" text-anchor="middle">${esc(toLbl)}</text>`);
    y += 62;
  }
  if(on) edge(`FraudCase ${p.graph_case_id||p.case_id}`, "CASE_ON", `Card ${on.to_id}`, "case");
  else   edge(`FraudCase ${p.graph_case_id||p.case_id}`, "CASE_ON", `Card ${p.card||"(answer)"}`, "case");
  if(dev) edge(`Txn ${p.flagged_txn}`, "FROM_DEVICE", `DeviceProfile ${(dev.toVertex&&dev.toVertex.id)||dev.to_id||"?"}`, "");
  if(bil) edge(`Txn ${p.flagged_txn}`, "BILLED_IN", `BillingRegion ${(bil.toVertex&&bil.toVertex.id)||bil.to_id||"?"}`, "");
  const rowsHtml = rows.length ? rows.join("") :
    `<text x="20" y="30" fill="#8b949e">no graph edges returned</text>`;
  box.innerHTML = `<svg width="${W}" height="${y+10}" viewBox="0 0 ${W} ${y+10}">
    <defs><marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>${rowsHtml}</svg>
    <div class="muted" style="font-size:11.5px">fetched live via <span class="mono">/restpp/graph/Fraud/edges/…</span>
    &nbsp;(queries: <span class="mono">flagged_transaction, card_window, device_neighbors, connected_ring</span>)</div>`;
}

async function show(id){
  active = id;
  document.querySelectorAll(".case").forEach(e=>e.classList.toggle("on", e.id==="li-"+id));
  const a = CASES[id]; if(!a) return;
  const c = a.case, nba = a.next_best_actions;
  const pct = Math.round(c.fraud_probability*100);
  $("#detail").innerHTML = `
    <h2 style="margin:0 0 2px">${id} — ${esc(c.verdict==="fraud"?"Confirmed fraud":c.verdict==="uncertain"?"Uncertain — escalated":"Legitimate")}</h2>
    <div class="chips">
      <span class="chip ${SC[c.status]||""}">status: ${esc(c.status)}</span>
      <span class="chip ${VC[c.verdict]||""}">verdict: ${esc(c.verdict)}</span>
      <span class="chip c-vbc">pattern: ${esc(c.pattern)}</span>
      ${a.sar.file ? `<span class="chip c-red">SAR required</span>` : `<span class="chip">no SAR</span>`}
      <span class="chip ${c.written_to_graph?"c-grn":"c-amb"}">${c.written_to_graph?"on graph: "+esc(c.graph_case_id):"not on graph"}</span>
      <span class="chip">tokens: ${a.tokens}</span>
    </div>
    ${c.pattern==="undocumented" ? `<div class="panel" style="margin-bottom:14px;border-color:var(--vbc)">
        <h2>New pattern discovered (R9)</h2>${esc(c.pattern_description)}</div>`:""}
    <div class="grid">
      <div class="panel"><h2>Uncertainty</h2>
        fraud_probability <b>${c.fraud_probability}</b> (${pct}%)
        <div class="meter"><i style="width:${pct}%"></i></div>
        <div class="muted">thresholds: policy.yaml only — ${esc(a.stop_reason)}</div>
        <div style="margin-top:8px">exposure <b>$${c.exposure_usd}</b>
          &middot; affected txns <b>${c.affected_txn_ids.length}</b>
          &middot; prior cases <b>${c.similar_prior_cases.length}</b></div>
        ${c.similar_prior_cases.length?`<div class="muted">case memory: ${c.similar_prior_cases.map(esc).join(", ")}</div>`:""}
      </div>
      <div class="panel"><h2>Recommendation before evidence</h2>${actions(nba.initial)}
        <div class="muted" style="margin-top:6px">${esc(nba.what_changed)}</div></div>
      <div class="panel wide"><h2>Evidence</h2>
        ${c.evidence.map(e=>`<div class="ev"><div>${esc(e.claim)}</div>
          <div><span class="src">source:</span> <b>${esc(e.source)}</b>
          <span class="ref"> ${esc(e.ref)}</span>
          <span class="src"> · entities: ${e.entity_ids.map(esc).join(", ")||"—"}</span></div></div>`).join("")}
      </div>
      <div class="panel"><h2>Recommendation after evidence (final)</h2>${actions(nba.final)}</div>
      <div class="panel"><h2>Case progression</h2>${timeline(a)}</div>
      ${graphPanel(id)}
      ${a.sar.file?`<div class="panel wide"><h2>SAR — filed (route L2)</h2>
        <div class="nar">${esc(a.sar.narrative)}</div>
        <div class="muted" style="margin-top:6px">subjects: ${a.sar.subjects.map(esc).join(", ")}
        &middot; $${a.sar.total_amount_usd} &middot; ${a.sar.activity_dates.join(" → ")}</div></div>`:""}
    </div>`;
  fetch(`/api/graph/case/${id}`).then(r=>r.json()).then(renderGraph).catch(e=>{
    const box=$("#gbox"); if(box) box.innerHTML=`<span id="err">${esc(e)}</span>`;});
}
boot();
</script>
</body>
</html>
