# Fraud Policy v1.0 — deterministic source of truth (from HHGOA_IEEE README).
# No LLM may override. Action/route identifiers must match spec exactly.
version: 1.0.0

actions:
  ALLOW_TRANSACTION: {route: auto}
  DECLINE_TRANSACTION: {route: L1}
  MONITOR_CARD: {route: auto}
  MONITOR_CONNECTED_CARDS: {route: auto}
  WARN_CUSTOMER: {route: auto}
  VERIFY_WITH_CUSTOMER: {route: auto}
  STEP_UP_AUTH: {route: auto}
  BLOCK_CARD: {route_by_exposure: {lte_2500: L1, gt_2500: L2}}
  BLOCK_ALL_CARDS: {route: L2}
  GENERATE_REPORT: {route: auto}
  CREATE_CASE: {route: auto}
  FILE_REPORT: {route: L2}
  ESCALATE_TO_ANALYST: {route: auto}
  CLOSE_NO_FRAUD: {route: auto}

rules:
  R1_verify_before_block: {max_single_signal_prob: 0.70}
  R2_customer_denies: {block: BLOCK_CARD, case: CREATE_CASE, report_if_exposure_gt: 1000.0}
  R4_no_reply: {escalate_if_exposure_gt: 500.0}
  R5_card_testing: {small_lt: 5.0, small_count_gte: 3, window_min: 60, block_if_cleared_gt: 100.0}
  R6_shared_origin: {report: true}
  R7_disputed_recurring: {min_same: 3, amount_tol: 0.10, gap_days: [25, 35]}
  R8_uncertain_escalate: {exposure_gt: 500.0}
  R10_block_all: {min_confirmed_cards: 2}
  trip_guard: {min_days: 3}
  case_open_threshold: 0.30
  sar_exposure_gt: 1000.0
  stop: {high_gte: 0.85, low_lte: 0.15, min_evidence: 2}
